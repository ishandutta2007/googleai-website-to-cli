<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 50px;
        fill: url(#accent-grad);
        letter-spacing: -1px;
      }
      
      .text-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }

      .text-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
      }

      .float-node {
        animation: float 4s ease-in-out infinite;
      }

      .pulse-circle {
        animation: pulse 3s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" />

  <!-- Subtle Modern Tech Grid -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1050" y1="0" x2="1050" y2="300" />
  </g>

  <!-- Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="1000" cy="150" r="160" fill="#4f46e5" opacity="0.15" filter="url(#soft-glow)" />
  <circle cx="700" cy="220" r="100" fill="#10b981" opacity="0.08" filter="url(#soft-glow)" />

  <!-- Architectural Diagram Nodes (Right Side) -->
  <g transform="translate(760, 40)">
    <!-- Connection Path CLI <-> Extension -->
    <path d="M 120,110 L 280,110" stroke="#475569" stroke-width="3" stroke-dasharray="6 6" />
    <path d="M 120,110 L 280,110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-dasharray" values="10, 20; 15, 15; 10, 20" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Browser Node -->
    <g class="float-node" style="animation-delay: 0s;">
      <rect x="30" y="50" width="140" height="120" rx="12" fill="#0b1120" stroke="#0284c7" stroke-width="2" filter="url(#glow)" />
      <!-- Browser Top Bar -->
      <path d="M 30,62 a 12,12 0 0 1 12,-12 h 116 a 12,12 0 0 1 12,12 v 18 h -140 z" fill="#1e293b" />
      <circle cx="48" cy="62" r="4" fill="#ef4444" />
      <circle cx="60" cy="62" r="4" fill="#eab308" />
      <circle cx="72" cy="62" r="4" fill="#22c55e" />
      <!-- Browser Content -->
      <rect x="45" y="90" width="110" height="10" rx="3" fill="#334155" />
      <rect x="45" y="108" width="80" height="10" rx="3" fill="#0284c7" />
      <rect x="45" y="126" width="95" height="10" rx="3" fill="#334155" />
      <text x="100" y="195" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Google AI / udm=50</text>
    </g>

    <!-- WebSocket Bridge Node Center Badge -->
    <g transform="translate(200, 110)" class="pulse-circle">
      <circle cx="0" cy="0" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
      <path d="M-8,-5 L-2,3 L8,-7" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-8,5 L2,-3 L8,5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="38" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">WS BRIDGE</text>
    </g>

    <!-- CLI Terminal Node -->
    <g class="float-node" style="animation-delay: -2s;">
      <rect x="230" y="50" width="140" height="120" rx="12" fill="#090d16" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
      <!-- Terminal Header -->
      <path d="M 230,62 a 12,12 0 0 1 12,-12 h 116 a 12,12 0 0 1 12,12 v 18 h -140 z" fill="#1e1e2e" />
      <text x="245" y="66" fill="#6c7086" font-family="monospace" font-size="11">&gt;_ bash</text>
      <!-- Terminal Content -->
      <text x="245" y="95" fill="#a6e3a1" font-family="monospace" font-size="12">$ googleai-cli</text>
      <text x="245" y="115" fill="#89dceb" font-family="monospace" font-size="11">&gt; query ready</text>
      <text x="245" y="135" fill="#f9e2af" font-family="monospace" font-size="11">✔ result saved</text>
      <rect x="342" y="125" width="7" height="12" fill="#34d399">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
      <text x="300" y="195" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Python CLI</text>
    </g>
  </g>

  <!-- Left Side Main Title & Content -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="180" height="28" rx="14" fill="#0f2942" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="text-badge">RPA BROWSER BRIDGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="text-title" filter="url(#glow)">googleai-website-to-cli</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="text-subtitle">Automate Google Search AI Mode (udm=50) via local WebSocket bridge</text>

    <!-- Tech Tags / Badges -->
    <g transform="translate(0, 210)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="50" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Python CLI</text>
      
      <!-- Tag 2 -->
      <rect x="110" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="180" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Browser Extension</text>
      
      <!-- Tag 3 -->
      <rect x="260" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="315" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">WebSocket</text>
    </g>
  </g>
</svg>
